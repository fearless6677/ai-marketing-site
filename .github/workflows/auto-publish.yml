name: Auto Publish

on:
  schedule:
    # UTC时间: 01:00, 06:00, 11:00 = 北京时间 09:00, 14:00, 19:00
    - cron: '0 1,6,11 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'content/**'

# 并发控制
concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Collect hotspots
        env:
          TZ: Asia/Shanghai
        run: python scripts/collect_hotspots.py

      - name: Generate articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: Asia/Shanghai
        run: python scripts/generate_article.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.8'
          extended: true

      - name: Build with Hugo
        env:
          HUGO_ENV: production
        run: hugo --minify

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ content/ logs/
          git diff --staged --quiet || git commit -m "feat: 自动更新内容 $(date +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit to Baidu
        if: github.ref == 'refs/heads/main'
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
        run: python scripts/submit_to_baidu.py || true

      - name: Submit to Google
        if: github.ref == 'refs/heads/main'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python scripts/submit_to_google.py || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
