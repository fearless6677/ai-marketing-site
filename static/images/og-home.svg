<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1929;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A237E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="#1976D2" opacity="0.1"/>
  <circle cx="1100" cy="500" r="80" fill="#42A5F5" opacity="0.1"/>
  <circle cx="900" cy="150" r="40" fill="#00BCD4" opacity="0.1"/>
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  <!-- Logo area -->
  <rect x="80" y="80" width="100" height="100" rx="20" fill="url(#accent)"/>
  <text x="130" y="138" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">AI</text>
  <!-- Title -->
  <text x="220" y="130" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white">AI营销集成服务</text>
  <!-- Tagline -->
  <text x="80" y="260" font-family="Arial, sans-serif" font-size="32" fill="#90CAF9">北上广研发 · 广西集成 · 东盟应用</text>
  <!-- Description -->
  <text x="80" y="340" font-family="Arial, sans-serif" font-size="24" fill="#B0BEC5">AI驱动的智能营销解决方案</text>
  <text x="80" y="380" font-family="Arial, sans-serif" font-size="24" fill="#B0BEC5">从策略到执行的全链路服务</text>
  <!-- Features -->
  <rect x="80" y="430" width="180" height="50" rx="8" fill="#1976D2" opacity="0.3"/>
  <text x="170" y="462" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle">🔥 热点追踪</text>
  <rect x="280" y="430" width="200" height="50" rx="8" fill="#1976D2" opacity="0.3"/>
  <text x="380" y="462" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle">🤖 内容生成</text>
  <rect x="500" y="430" width="200" height="50" rx="8" fill="#1976D2" opacity="0.3"/>
  <text x="600" y="462" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle">📊 数据分析</text>
  <!-- URL -->
  <text x="80" y="570" font-family="Arial, sans-serif" font-size="20" fill="#42A5F5">aimarketing.site</text>
  <!-- Bottom accent -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>
</svg>
